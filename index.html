<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>GTA SA Online CLEO Compiler</title>

<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#0c0f14',
          panel: '#12161d',
          panel2: '#181d26',
          hairline: '#242b36',
          amber: '#e8a33d',
          amberdim: '#8a6528',
          teal: '#3fa9a0',
          teal2: '#2e8a82',
          bad: '#e05a4e',
          good: '#57b06b',
        },
        fontFamily: {
          mono: ['"JetBrains Mono"', '"Fira Code"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          display: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'],
        },
      },
    },
  };
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  html, body { background: #0c0f14; color: #e5e7eb; overflow-x: hidden; font-family: monospace; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #12161d; }
  ::-webkit-scrollbar-thumb { background: #242b36; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #303947; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
  .cursor-blink { animation: blink 1.2s step-end infinite; }
  .hex-addr { font-variant-numeric: tabular-nums; letter-spacing: 0.05em; }
  #editor-container { height: 50vh; min-height: 320px; }
  
  .fullscreen-editor { 
    position: fixed !important; 
    inset: 0 !important; 
    z-index: 99999 !important; 
    width: 100vw !important; 
    height: 100vh !important; 
    background: #0c0f14 !important; 
    padding: 6px; 
    display: flex; 
    flex-direction: column; 
  }
  .fullscreen-editor #editor-container { height: calc(100vh - 45px) !important; flex: 1; }
  .btn-press:active { transform: translateY(1px); }
  .error-line-highlight { background-color: rgba(224, 90, 78, 0.20) !important; border-left: 3px solid #e05a4e !important; }

  @media screen and (max-width: 640px) {
    header .max-w-6xl { padding-left: 8px; padding-right: 8px; }
    main { padding-left: 8px !important; padding-right: 8px !important; }
    #editor-container { height: 46vh; min-height: 280px; }
    .monaco-editor { font-size: 14px !important; }
  }
</style>
</head>
<body class="bg-ink text-gray-200 font-mono min-h-screen flex flex-col">

  <input type="file" id="file-upload-input" accept=".txt,.cs,.csa,.csi" class="hidden" />
  <input type="file" id="decompile-upload-input" accept=".cs,.csa,.csi" class="hidden" />
  <input type="file" id="db-upload-input" accept=".db" class="hidden" />

  <!-- HEADER -->
  <header class="border-b border-hairline bg-panel/95 backdrop-blur sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-3 py-2.5 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <div class="w-7 h-7 rounded-sm bg-amber/10 border border-amber/40 flex items-center justify-center text-amber font-display font-bold text-xs shrink-0">
          CS
        </div>
        <div class="min-w-0">
          <h1 class="font-display font-semibold text-gray-100 text-xs sm:text-sm tracking-tight truncate">
            GTA SA <span class="text-amber">CLEO</span> Compiler
          </h1>
          <p class="text-[9px] text-gray-500 hex-addr truncate">sanny.exe</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <a href="community.html" class="btn-press w-8 h-8 rounded-sm border border-teal/50 bg-teal/10 text-teal hover:bg-teal/20 transition-colors flex items-center justify-center text-sm font-bold text-decoration-none" title="Community Hub">
          🌐
        </a>

        <button id="header-publish-btn" class="btn-press w-8 h-8 rounded-sm border border-amber/50 bg-amber/10 text-amber hover:bg-amber/20 transition-colors flex items-center justify-center text-sm" title="Publish Script">
          🚀
        </button>
        <a href="documentation.html" class="btn-style">📖 Docs</a>

        <button id="opcode-btn" class="btn-press text-[11px] px-3 py-1.5 rounded-sm border border-hairline text-gray-300 hover:text-amber hover:border-amber/50 transition-colors">
          Opcodes
        </button>

        <div class="relative">
          <button id="gh-config-btn" class="btn-press text-[11px] px-3 py-1.5 rounded-sm border border-hairline bg-panel2 text-gray-200 hover:border-amber/50 transition-colors flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5 fill-current shrink-0" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            <span id="gh-btn-text">GitHub</span>
          </button>
          
          <div id="gh-dropdown" class="hidden absolute right-0 mt-2 w-48 bg-panel border border-hairline rounded-sm shadow-xl z-50 py-1 text-[11.5px]" style="display: none;">
            <div class="px-3 py-1.5 border-b border-hairline text-gray-400 truncate">
              Repo: <strong id="gh-repo-label" class="text-amber">Not set</strong>
            </div>
            <button id="gh-save-source" class="w-full text-left px-3 py-2 text-gray-300 hover:bg-panel2 hover:text-amber transition-colors">💾 Save Source (.txt)</button>
            <button id="gh-save-compiled" class="w-full text-left px-3 py-2 text-gray-300 hover:bg-panel2 hover:text-amber transition-colors">☁️ Save Compiled (.cs)</button>
            <div class="border-t border-hairline my-1"></div>
            <button id="gh-publish-gist" class="w-full text-left px-3 py-2 text-teal hover:bg-panel2 transition-colors font-bold">🚀 Publish to Community</button>
            <div class="border-t border-hairline my-1"></div>
            <button id="gh-settings-open" class="w-full text-left px-3 py-2 text-amber hover:bg-panel2 transition-colors">⚙️ Configure Token/Repo</button>
            <button id="gh-disconnect" class="w-full text-left px-3 py-2 text-bad hover:bg-panel2 transition-colors">🗑️ Disconnect Repo</button>
          </div>
        </div>

      </div>
    </div>
  </header>

  <!-- GITHUB CONFIG MODAL -->
  <div id="gh-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-3" style="display: none;">
    <div class="bg-panel border border-hairline rounded-sm max-w-md w-full p-4 sm:p-5 flex flex-col gap-3.5 shadow-2xl">
      <div class="flex items-center justify-between border-b border-hairline pb-2.5">
        <h2 class="font-display text-xs sm:text-sm text-gray-100 font-semibold">GitHub Private Sync</h2>
        <button id="gh-modal-close" class="text-gray-500 hover:text-gray-200 text-lg leading-none">&times;</button>
      </div>
      <div class="bg-blue-900/10 border border-blue-500/20 p-2.5 rounded-sm">
        <p class="text-[10px] text-blue-300 leading-relaxed"><strong>🔒 Privacy:</strong> Token stored in browser local storage.</p>
      </div>
      <div class="flex flex-col gap-2.5 text-[11.5px]">
        <div>
          <label class="block text-gray-400 mb-1">GitHub PAT Token:</label>
          <input type="password" id="gh-token-input" placeholder="ghp_xxxxxxxxxxxx" class="bg-panel2 text-gray-200 border border-hairline rounded-sm px-2.5 py-2 w-full focus:outline-none focus:border-amber font-mono text-xs" />
        </div>
        <div>
          <label class="block text-gray-400 mb-1">Repository Name (owner/repo):</label>
          <input type="text" id="gh-repo-input" placeholder="e.g. Testermt/CleoSave" class="bg-panel2 text-gray-200 border border-hairline rounded-sm px-2.5 py-2 w-full focus:outline-none focus:border-amber font-mono text-xs" />
        </div>
        <div>
          <label class="block text-gray-400 mb-1">Branch:</label>
          <input type="text" id="gh-branch-input" value="main" class="bg-panel2 text-gray-200 border border-hairline rounded-sm px-2.5 py-2 w-full focus:outline-none focus:border-amber font-mono text-xs" />
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2 border-t border-hairline">
        <button id="gh-modal-close-btn" class="px-3 py-1.5 text-gray-400 text-[11px]">Cancel</button>
        <button id="gh-save-config" class="btn-press text-[11px] px-3.5 py-1.5 bg-amber text-ink font-semibold rounded-sm hover:bg-amber/90">Save &amp; Sync</button>
      </div>
    </div>
  </div>

  <!-- PUBLISH SCRIPT MODAL -->
  <div id="publish-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-3" style="display: none;">
    <div class="bg-panel border border-hairline rounded-sm max-w-md w-full p-4 sm:p-5 flex flex-col gap-3.5 shadow-2xl">
      <div class="flex items-center justify-between border-b border-hairline pb-2.5">
        <h2 class="font-display text-xs sm:text-sm text-amber font-semibold">Publish Script to Community</h2>
        <button id="publish-modal-close" class="text-gray-500 hover:text-gray-200 text-lg leading-none">&times;</button>
      </div>
      <div class="flex flex-col gap-2.5 text-[11.5px]">
        <div>
          <label class="block text-gray-400 mb-1">Script Title / Description:</label>
          <input type="text" id="pub-title-input" placeholder="e.g. Awesome Car Spawner Script" class="bg-panel2 text-gray-200 border border-hairline rounded-sm px-2.5 py-2 w-full focus:outline-none focus:border-amber font-mono text-xs" />
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2 border-t border-hairline">
        <button id="pub-modal-cancel" class="px-3 py-1.5 text-gray-400 text-[11px]">Cancel</button>
        <button id="pub-modal-submit" class="btn-press text-[11px] px-3.5 py-1.5 bg-amber text-ink font-semibold rounded-sm hover:bg-amber/90">Publish Now 🚀</button>
      </div>
    </div>
  </div>

  <!-- GUI ERROR SCREENSHOT POPUP MODAL -->
  <div id="gui-screenshot-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-3" style="display: none;">
    <div class="bg-panel border border-hairline rounded-sm max-w-3xl w-full p-4 flex flex-col gap-3 shadow-2xl">
      <div class="flex items-center justify-between border-b border-hairline pb-2">
        <h2 class="font-display text-xs sm:text-sm text-amber font-semibold">Sanny Builder GUI Error Output</h2>
        <button id="gui-modal-close" class="text-gray-500 hover:text-gray-200 text-lg leading-none">&times;</button>
      </div>
      <div class="bg-panel2 border border-hairline rounded-sm overflow-hidden flex items-center justify-center p-2">
        <img id="gui-screenshot-img" src="" alt="Compiler GUI Output" class="max-w-full max-h-[70vh] object-contain rounded" />
      </div>
      <div class="flex justify-end pt-1">
        <button id="gui-modal-ok" class="btn-press text-[11px] px-4 py-1.5 bg-amber text-ink font-semibold rounded-sm hover:bg-amber/90">Close</button>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-2 sm:px-4 py-3 flex flex-col gap-3">
    <div class="bg-amber/10 border border-amber/30 rounded-sm p-2.5 text-[11px] text-amber flex flex-col sm:flex-row items-center justify-between gap-2">
      <p class="text-center sm:text-left"><strong>Server Notice:</strong> Request Queue System is active to handle traffic spikes.</p>
    </div>

    <!-- Toolbar -->
    <div class="flex flex-col sm:flex-row flex-wrap items-stretch sm:items-center justify-between gap-2.5 bg-panel p-2.5 sm:p-3 rounded-sm border border-hairline">
      <select id="gameSelect" class="bg-panel2 text-gray-200 border border-hairline rounded-sm px-2 py-1 text-[11.5px]">
        <option value="sa" selected>GTA SA (PC - .cs)</option>
        <option value="sa_mobile_csa">GTA SA (Mobile - .csa)</option>
      </select>
      <button id="compile-btn" class="btn-press py-2 px-4 rounded-sm bg-amber text-ink font-bold">Compile &amp; Download</button>
      <button id="compile-gui-btn" class="btn-press py-2 px-3 rounded-sm bg-panel2 border border-amber/50 text-amber font-bold">📸 GUI Check</button>
    </div>

    <!-- Editor Wrapper -->
    <div id="editor-wrapper-box" class="rounded-sm border border-hairline overflow-hidden shadow-2xl flex flex-col bg-panel">
      <div id="editor-container"></div>
    </div>
  </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs/loader.min.js"></script>
<script>
  const API_BASE = window.CLEO_API_BASE || 'https://cleo-compiler-testing.onrender.com';
  let editor;

  require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs' } });
  require(['vs/editor/editor.main'], function () {
    editor = monaco.editor.create(document.getElementById('editor-container'), {
      value: '{$CLEO .cs}\\n\\n0000: NOP\\n',
      language: 'cpp',
      theme: 'vs-dark',
      automaticLayout: true
    });
  });

  const guiModal = document.getElementById('gui-screenshot-modal');
  const guiScreenshotImg = document.getElementById('gui-screenshot-img');
  document.getElementById('gui-modal-close').addEventListener('click', () => guiModal.style.display = 'none');
  document.getElementById('gui-modal-ok').addEventListener('click', () => guiModal.style.display = 'none');

  document.getElementById('compile-gui-btn').addEventListener('click', async () => {
    if (!editor) return;
    const code = editor.getValue();
    const response = await fetch(`${API_BASE}/api/compile-gui`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, filename: 'script.txt', game: 'sa' })
    });
    const data = await response.json();
    if (data.success && data.gui_screenshot) {
      guiScreenshotImg.src = data.gui_screenshot;
      guiModal.style.display = 'flex';
    }
  });
</script>
</body>
</html>
