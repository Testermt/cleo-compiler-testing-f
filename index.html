<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>GTA SA Online CLEO Compiler - Live GUI</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { background: #0c0f14; overflow-x: hidden; color: #e5e7eb; }
  #editor-container { height: 40vh; min-height: 250px; }
  #vnc-screen-container { width: 100%; height: 45vh; min-height: 300px; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
  .btn-press:active { transform: translateY(1px); }
</style>
</head>
<body class="bg-ink text-gray-200 font-mono min-h-screen flex flex-col">

  <header class="border-b border-gray-800 bg-[#12161d] p-3">
    <h1 class="text-sm font-bold text-amber-400">GTA SA CLEO Compiler (Live GUI Stream)</h1>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto p-3 flex flex-col gap-3">
    <div class="flex gap-2">
      <button id="start-session-btn" class="py-2 px-3 bg-teal-600 text-black font-bold rounded text-xs"> Start Live Stream</button>
      <button id="compile-gui-btn" class="py-2.5 px-4 bg-amber-500 text-black font-bold rounded text-xs flex-1"> Trigger Compile (F6)</button>
    </div>

    <!-- Live VNC Stream Canvas Container -->
    <div id="vnc-screen-container" class="rounded border border-gray-800">
      <div id="vnc-canvas-target" style="width: 100%; height: 100%;"></div>
    </div>

    <div id="editor-container" class="rounded border border-gray-800"></div>

    <div id="console-log" class="h-24 bg-[#12161d] border border-gray-800 rounded p-2 text-xs overflow-y-auto text-gray-400">
      <div>&gt; Click 'Start Live Stream' to boot Sanny Builder UI...</div>
    </div>
  </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs/loader.min.js"></script>
<script type="module">
  import RFB from 'https://cdn.jsdelivr.net/npm/@novnc/novnc@1.4.0/dist/rfb.js';

  const API_BASE = window.CLEO_API_BASE || 'https://cleo-compiler-testing.onrender.com';
  let editor;
  let rfb = null;

  require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs' } });
  require(['vs/editor/editor.main'], function () {
    editor = monaco.editor.create(document.getElementById('editor-container'), {
      value: `{$CLEO .cs}\n\n0000: NOP\n03A4: name_thread 'MAIN'\n\n:MAIN_START\nwait 0\nif\n  0256:   player $PLAYER_CHAR defined\njf @MAIN_START\n\n0001: wait 0\n0417: create_pickup_marker_at 0.0 0.0 0.0 color 1\n\n:MAIN_LOOP\nwait 250\njump @MAIN_LOOP\n`,
      language: 'cpp',
      theme: 'vs-dark',
      automaticLayout: true,
      fontSize: 13
    });
  });

  const consoleLog = document.getElementById('console-log');
  function logLine(text, type = 'info') {
    const line = document.createElement('div');
    line.className = type === 'error' ? 'text-red-400' : (type === 'success' ? 'text-green-400' : 'text-gray-300');
    line.innerHTML = `[${new Date().toLocaleTimeString()}] ${text}`;
    consoleLog.appendChild(line);
    consoleLog.scrollTop = consoleLog.scrollHeight;
  }

  document.getElementById('start-session-btn').addEventListener('click', async () => {
    logLine('Booting Sanny Builder and starting VNC stream...', 'info');
    try {
      const res = await fetch(`${API_BASE}/api/gui/session/start`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ game: 'sa' })
      });
      const data = await res.json();
      if (data.success) {
        logLine('Session started! Connecting live stream...', 'success');
        
        // Connect via noVNC WebSocket (Port 6080 on your backend domain)
        const host = new URL(API_BASE).hostname;
        const wsUrl = `wss://${host}:6080/websockify`;
        
        if (rfb) {
          rfb.disconnect();
        }
        
        const target = document.getElementById('vnc-canvas-target');
        rfb = new RFB(target, wsUrl, { credentials: { password: '' } });
        rfb.scaleWithWindow = true;
        rfb.resizeSession = true;
      } else {
        logLine(`Error: ${data.error}`, 'error');
      }
    } catch (err) {
      logLine(`Network error: ${err.message}`, 'error');
    }
  });

  document.getElementById('compile-gui-btn').addEventListener('click', async () => {
    if (!editor) return;
    const code = editor.getValue();
    logLine('Updating code & triggering F6...', 'info');
    try {
      const actionRes = await fetch(`${API_BASE}/api/gui/session/action`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, keys: 'F6' })
      });
      const actionData = await actionRes.json();
      if (actionData.success) {
        logLine('F6 triggered! Check the live stream window above for errors.', 'success');
      } else {
        logLine(`Action Error: ${actionData.error}`, 'error');
      }
    } catch (err) {
      logLine(`Network error: ${err.message}`, 'error');
    }
  });
</script>
</body>
</html>
