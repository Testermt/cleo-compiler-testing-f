<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>GTA SA Online CLEO Compiler</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#0c0f14',
          panel: '#12161d',
          panel2: '#181d26',
          hairline: '#242b36',
          amber: '#e8a33d',
          amberdim: '#8a6528',
          teal: '#3fa9a0',
          teal2: '#2e8a82',
          bad: '#e05a4e',
          good: '#57b06b',
        },
        fontFamily: {
          mono: ['"JetBrains Mono"', '"Fira Code"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          display: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'],
        },
      },
    },
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { background: #0c0f14; overflow-x: hidden; color: #e5e7eb; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #12161d; }
  ::-webkit-scrollbar-thumb { background: #242b36; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #303947; }
  #editor-container { height: 50vh; min-height: 320px; }
  .btn-press:active { transform: translateY(1px); }
</style>
</head>
<body class="bg-ink text-gray-200 font-mono min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="border-b border-hairline bg-panel/95 backdrop-blur sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-3 py-2.5 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <div class="w-7 h-7 rounded-sm bg-amber/10 border border-amber/40 flex items-center justify-center text-amber font-display font-bold text-xs shrink-0">CS</div>
        <div class="min-w-0">
          <h1 class="font-display font-semibold text-gray-100 text-xs sm:text-sm tracking-tight truncate">GTA SA <span class="text-amber">CLEO</span> Compiler</h1>
        </div>
      </div>
    </div>
  </header>

  <!-- GUI ERROR SCREENSHOT POPUP MODAL -->
  <div id="gui-screenshot-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-3" style="display: none;">
    <div class="bg-panel border border-hairline rounded-sm max-w-3xl w-full p-4 flex flex-col gap-3 shadow-2xl">
      <div class="flex items-center justify-between border-b border-hairline pb-2">
        <h2 class="font-display text-xs sm:text-sm text-amber font-semibold">Sanny Builder GUI Live Screen</h2>
        <button id="gui-modal-close" class="text-gray-500 hover:text-gray-200 text-lg leading-none">&times;</button>
      </div>
      <div class="bg-panel2 border border-hairline rounded-sm overflow-hidden flex items-center justify-center p-2">
        <img id="gui-screenshot-img" src="" alt="Compiler GUI Output" class="max-w-full max-h-[70vh] object-contain rounded" />
      </div>
      <div class="flex justify-end pt-1">
        <button id="gui-modal-ok" class="btn-press text-[11px] px-4 py-1.5 bg-amber text-ink font-semibold rounded-sm">Close</button>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-2 sm:px-4 py-3 flex flex-col gap-3">
    <div class="flex gap-2">
      <button id="start-session-btn" class="btn-press text-xs py-2 px-3 rounded-sm bg-teal text-ink font-bold">🟢 Start Session</button>
      <button id="compile-btn" class="btn-press text-xs sm:text-sm py-2.5 px-4 rounded-sm bg-amber text-ink font-bold flex-1">Compile &amp; Download</button>
      <button id="compile-gui-btn" class="btn-press text-xs sm:text-sm py-2.5 px-3 rounded-sm bg-panel2 border border-amber/50 text-amber font-bold hover:bg-amber/10 shrink-0">📸 GUI Check</button>
    </div>

    <div id="editor-wrapper-box" class="rounded-sm border border-hairline overflow-hidden shadow-2xl flex flex-col bg-panel">
      <div id="editor-container"></div>
    </div>

    <div class="rounded-sm border border-hairline bg-panel flex flex-col">
      <div id="console-log" class="h-32 overflow-y-auto px-3 py-2 text-[11.5px] leading-relaxed space-y-1">
        <div class="text-gray-600">&gt; awaiting session start&hellip;</div>
      </div>
    </div>
  </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs/loader.min.js"></script>
<script>
  const API_BASE = window.CLEO_API_BASE || 'https://cleo-compiler-testing.onrender.com';
  let editor;

  require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs' } });
  require(['vs/editor/editor.main'], function () {
    editor = monaco.editor.create(document.getElementById('editor-container'), {
      value: `{$CLEO .cs}\n\n0000: NOP\n03A4: name_thread 'MAIN'\n\n:MAIN_START\nwait 0\nif\n  0256:   player $PLAYER_CHAR defined\njf @MAIN_START\n\n0001: wait 0\n0417: create_pickup_marker_at 0.0 0.0 0.0 color 1\n\n:MAIN_LOOP\nwait 250\njump @MAIN_LOOP\n`,
      language: 'cpp',
      theme: 'vs-dark',
      automaticLayout: true,
      fontSize: 13
    });
  });

  const consoleLog = document.getElementById('console-log');
  function logLine(text, type = 'info') {
    const line = document.createElement('div');
    line.className = type === 'error' ? 'text-bad' : (type === 'success' ? 'text-good' : 'text-gray-400');
    line.innerHTML = `[${new Date().toLocaleTimeString()}] ${text}`;
    consoleLog.appendChild(line);
    consoleLog.scrollTop = consoleLog.scrollHeight;
  }

  // 1. Start Background Persistent Session
  document.getElementById('start-session-btn').addEventListener('click', async () => {
    logLine('Starting persistent Sanny Builder session...', 'info');
    try {
      const res = await fetch(`${API_BASE}/api/gui/session/start`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ game: document.getElementById('gameSelect')?.value || 'sa' })
      });
      const data = await res.json();
      if (data.success) {
        logLine('Persistent session started successfully!', 'success');
      } else {
        logLine(`Error: ${data.error}`, 'error');
      }
    } catch (err) {
      logLine(`Network error: ${err.message}`, 'error');
    }
  });

  // Modal Handlers
  const guiModal = document.getElementById('gui-screenshot-modal');
  const guiScreenshotImg = document.getElementById('gui-screenshot-img');
  document.getElementById('gui-modal-close').addEventListener('click', () => guiModal.style.display = 'none');
  document.getElementById('gui-modal-ok').addEventListener('click', () => guiModal.style.display = 'none');

  // 2. GUI Check: Injects code, presses F6, and pulls live screenshot instantly anytime!
  document.getElementById('compile-gui-btn').addEventListener('click', async () => {
    if (!editor) return;
    const code = editor.getValue();
    logLine('Executing action & fetching live screenshot...', 'info');
    try {
      // Send code, Ctrl+A, Ctrl+V, and F6 compile trigger
      const actionRes = await fetch(`${API_BASE}/api/gui/session/action`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, keys: 'F6' })
      });
      const actionData = await actionRes.json();
      if (!actionData.success) {
        logLine(`Action Error: ${actionData.error}`, 'error');
        return;
      }

      // Small delay for compile popup/render to paint
      await new Promise(r => setTimeout(r, 1200));

      // Fetch instant live screenshot
      const ssRes = await fetch(`${API_BASE}/api/gui/session/screenshot`);
      const ssData = await ssRes.json();

      if (ssData.success && ssData.gui_screenshot) {
        guiScreenshotImg.src = ssData.gui_screenshot;
        guiModal.style.display = 'flex';
        logLine('Live screenshot updated successfully!', 'success');
      } else {
        logLine(`Screenshot Error: ${ssData.error}`, 'error');
      }
    } catch (err) {
      logLine(`Network error: ${err.message}`, 'error');
    }
  });
</script>
</body>
</html>
