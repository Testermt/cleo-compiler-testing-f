<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>GTA SA Online CLI CLEO Compiler</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { background: #0c0f14; overflow-x: hidden; color: #e5e7eb; }
  #editor-container { height: 50vh; min-height: 320px; }
  .btn-press:active { transform: translateY(1px); }
</style>
</head>
<body class="bg-ink text-gray-200 font-mono min-h-screen flex flex-col">

  <header class="border-b border-gray-800 bg-[#12161d] p-3 flex justify-between items-center">
    <h1 class="text-sm font-bold text-amber-400">GTA SA Online CLEO Compiler (CLI Engine)</h1>
    <span class="text-[10px] bg-teal-900 text-teal-300 px-2 py-0.5 rounded">Deep Syntax Checking Active</span>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto p-3 flex flex-col gap-3">
    <div class="flex gap-2 flex-wrap items-center">
      <!-- Game Mode Dropdown -->
      <select id="game-select" class="py-2 px-2 bg-[#12161d] border border-gray-700 text-amber-400 font-bold rounded text-xs">
        <option value="sa_mobile">GTA SA Mobile</option>
        <option value="sa">GTA San Andreas (SA)</option>
        <option value="vc">GTA Vice City (VC)</option>
        <option value="gta3">GTA III</option>
      </select>

      <button id="compile-btn" class="py-2.5 px-4 bg-amber-500 text-black font-bold rounded text-xs flex-1 btn-press flex items-center justify-center gap-1">
        <span>⚡ Compile & Check Syntax</span>
      </button>
      <button id="clear-console-btn" class="py-2.5 px-3 bg-gray-700 text-white font-bold rounded text-xs btn-press">Clear Log</button>
    </div>

    <!-- Monaco Editor Container -->
    <div id="editor-container" class="rounded border border-gray-800"></div>

    <!-- Console Output Log -->
    <div class="flex flex-col gap-1">
      <div class="text-[11px] text-gray-400 font-bold px-1">COMPILER CONSOLE & DEEP ERROR LOGS</div>
      <div id="console-log" class="h-40 bg-[#12161d] border border-gray-800 rounded p-2 text-xs overflow-y-auto text-gray-400 flex flex-col gap-1">
        <div>&gt; System Ready. Engine initialized with setting.ini rules via CLI.</div>
      </div>
    </div>
  </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs/loader.min.js"></script>
<script>
  const API_BASE = window.CLEO_API_BASE || 'https://cleo-compiler-testing-gzf6.onrender.com';
  let editor;

  require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs' } });
  require(['vs/editor/editor.main'], function () {
    editor = monaco.editor.create(document.getElementById('editor-container'), {
      value: `{$CLEO .cs}\n\n0000: NOP\n03A4: name_thread 'MAIN'\n\n:MAIN_START\nwait 0\nif\n  0256:   player $PLAYER_CHAR defined\njf @MAIN_START\n\n0001: wait 0\n0417: create_pickup_marker_at 0.0 0.0 0.0 color 1\n\n:MAIN_LOOP\nwait 250\njump @MAIN_LOOP\n`,
      language: 'cpp',
      theme: 'vs-dark',
      automaticLayout: true,
      fontSize: 13
    });
  });

  const consoleLog = document.getElementById('console-log');
  function logLine(text, type = 'info') {
    const line = document.createElement('div');
    line.className = type === 'error' ? 'text-red-400 font-bold' : (type === 'success' ? 'text-green-400' : 'text-gray-300');
    line.innerHTML = `[${new Date().toLocaleTimeString()}] ${text}`;
    consoleLog.appendChild(line);
    consoleLog.scrollTop = consoleLog.scrollHeight;
  }

  document.getElementById('clear-console-btn').addEventListener('click', () => {
    consoleLog.innerHTML = '<div>&gt; Console cleared.</div>';
  });

  // Compile Button Click Handler
  document.getElementById('compile-btn').addEventListener('click', async () => {
    if (!editor) return;
    const code = editor.getValue();
    const game = document.getElementById('game-select').value;

    logLine('Sending code to CLI compiler with all setting.ini rules...', 'info');

    try {
      const res = await fetch(`${API_BASE}/api/cli/compile`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, game })
      });
      const data = await res.json();

      if (data.console) {
        data.console.split('\n').forEach(line => {
          if (line.trim()) logLine(line, data.success ? 'info' : 'error');
        });
      }

      if (data.success && data.compiled_file_base64) {
        logLine(data.message, 'success');

        // Auto trigger download for compiled .cs file
        const byteCharacters = atob(data.compiled_file_base64);
        const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        const blob = new Blob([byteArray], { type: 'application/octet-stream' });
        
        const link = document.createElement('a');
        link.href = window.URL.createObjectURL(blob);
        link.download = 'script.cs';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        logLine('Compiled .cs file downloaded automatically!', 'success');
      } else {
        logLine(data.error || 'Compilation failed.', 'error');
      }
    } catch (err) {
      logLine(`Network error: ${err.message}`, 'error');
    }
  });
</script>
</body>
</html>
