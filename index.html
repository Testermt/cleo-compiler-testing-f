<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>GTA SA Online CLEO Compiler</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { background: #0c0f14; overflow-x: hidden; color: #e5e7eb; }
  #editor-container { height: 50vh; min-height: 320px; }
  .btn-press:active { transform: translateY(1px); }
</style>
</head>
<body class="bg-ink text-gray-200 font-mono min-h-screen flex flex-col">

  <header class="border-b border-gray-800 bg-[#12161d] p-3 flex justify-between items-center">
    <h1 class="text-sm font-bold text-amber-400">GTA SA CLEO Compiler (GUI Suite)</h1>
    <span id="session-status" class="text-[11px] text-yellow-400">⚡ Initializing session...</span>
  </header>

  <!-- GUI SCREENSHOT MODAL -->
  <div id="gui-screenshot-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-3" style="display: none;">
    <div class="bg-[#12161d] border border-gray-700 rounded p-4 max-w-3xl w-full flex flex-col gap-3">
      <div class="flex justify-between items-center border-b border-gray-700 pb-2">
        <h2 class="text-amber-400 text-sm font-bold">Sanny Builder GUI Output</h2>
        <button id="gui-modal-close" class="text-gray-400 hover:text-white text-lg">&times;</button>
      </div>
      <div class="bg-[#181d26] p-2 flex justify-center rounded">
        <img id="gui-screenshot-img" src="" alt="GUI Output" class="max-w-full max-h-[70vh] object-contain rounded" />
      </div>
    </div>
  </div>

  <main class="flex-1 max-w-6xl w-full mx-auto p-3 flex flex-col gap-3">
    <!-- Controls Bar -->
    <div class="flex gap-2 items-center flex-wrap bg-[#12161d] p-2 rounded border border-gray-800">
      <div class="flex flex-col gap-1 flex-1 min-w-[150px]">
        <label class="text-[10px] text-gray-400">Target Game:</label>
        <select id="game-select" class="bg-[#181d26] border border-gray-700 text-xs p-1.5 rounded text-amber-400 font-bold">
          <option value="sa">GTA San Andreas</option>
          <option value="sa_mobile" selected>GTA SA Mobile</option>
          <option value="vc">GTA Vice City</option>
          <option value="gta3">GTA III</option>
        </select>
      </div>
      <button id="check-status-btn" class="py-2.5 px-3 bg-[#181d26] border border-gray-700 text-gray-300 font-bold rounded text-xs btn-press">🔍 Check Status</button>
      <button id="compile-btn" class="py-2.5 px-4 bg-amber-500 text-black font-bold rounded text-xs btn-press" disabled>⚡ Compile (F6)</button>
      <button id="decompile-btn" class="py-2.5 px-4 bg-teal-500 text-black font-bold rounded text-xs btn-press" disabled>⚙️ Decompile (F5)</button>
    </div>

    <div id="editor-container" class="rounded border border-gray-800"></div>

    <div id="console-log" class="h-32 bg-[#12161d] border border-gray-800 rounded p-2 text-xs overflow-y-auto text-gray-400">
      <div>&gt; Page loaded. Automatically booting Sanny Builder in background...</div>
    </div>
  </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs/loader.min.js"></script>
<script>
  const API_BASE = window.CLEO_API_BASE || 'https://cleo-compiler-testing.onrender.com';
  let editor;

  require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs' } });
  require(['vs/editor/editor.main'], function () {
    editor = monaco.editor.create(document.getElementById('editor-container'), {
      value: `{$CLEO .cs}\n\n0000: NOP\n03A4: name_thread 'MAIN'\n\n:MAIN_START\nwait 0\nif\n  0256:   player $PLAYER_CHAR defined\njf @MAIN_START\n\n0001: wait 0\n0417: create_pickup_marker_at 0.0 0.0 0.0 color 1\n\n:MAIN_LOOP\nwait 250\njump @MAIN_LOOP\n`,
      language: 'cpp',
      theme: 'vs-dark',
      automaticLayout: true,
      fontSize: 13
    });
  });

  const consoleLog = document.getElementById('console-log');
  function logLine(text, type = 'info') {
    const line = document.createElement('div');
    line.className = type === 'error' ? 'text-red-400' : (type === 'success' ? 'text-green-400' : 'text-gray-300');
    line.innerHTML = `[${new Date().toLocaleTimeString()}] ${text}`;
    consoleLog.appendChild(line);
    consoleLog.scrollTop = consoleLog.scrollHeight;
  }

  // --- AUTO SESSION START ON PAGE LOAD ---
  window.addEventListener('DOMContentLoaded', async () => {
    const statusSpan = document.getElementById('session-status');
    const compileBtn = document.getElementById('compile-btn');
    const decompileBtn = document.getElementById('decompile-btn');
    const gameSelect = document.getElementById('game-select');

    logLine('Starting background session...', 'info');
    try {
      const res = await fetch(`${API_BASE}/api/gui/session/start`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ game: gameSelect.value })
      });
      const data = await res.json();
      if (data.success) {
        logLine('Sanny Builder session initiated. Click "Check Status" to verify.', 'success');
        statusSpan.textContent = '⚡ Initialized';
      } else {
        logLine(`Session Error: ${data.error}`, 'error');
        statusSpan.textContent = '🔴 Failed';
      }
    } catch (err) {
      logLine(`Network error: ${err.message}`, 'error');
      statusSpan.textContent = '🔴 Error';
    }
  });

  // Check Status Button Click Handler
  document.getElementById('check-status-btn').addEventListener('click', async () => {
    logLine('Checking Sanny Builder boot status...', 'info');
    try {
      const res = await fetch(`${API_BASE}/api/gui/session/status`);
      const data = await res.json();
      if (data.success && data.booted) {
        logLine(data.message, 'success');
        document.getElementById('session-status').textContent = '🟢 Session Ready';
        document.getElementById('session-status').className = 'text-[11px] text-green-400 font-bold';
        document.getElementById('compile-btn').disabled = false;
        document.getElementById('decompile-btn').disabled = false;
      } else {
        logLine(data.message || 'Sanny Builder is still loading...', 'error');
      }
    } catch (err) {
      logLine(`Network error: ${err.message}`, 'error');
    }
  });

  const guiModal = document.getElementById('gui-screenshot-modal');
  const guiScreenshotImg = document.getElementById('gui-screenshot-img');
  document.getElementById('gui-modal-close').addEventListener('click', () => guiModal.style.display = 'none');

  // Trigger Action Handler (Compile or Decompile)
  async function runAction(actionType) {
    if (!editor) return;
    const code = editor.getValue();
    const game = document.getElementById('game-select').value;

    logLine(`Executing ${actionType} with game mode: ${game}...`, 'info');
    try {
      const res = await fetch(`${API_BASE}/api/gui/session/action`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: actionType, code, game })
      });
      const data = await res.json();
      if (data.success && data.gui_screenshot) {
        guiScreenshotImg.src = data.gui_screenshot;
        guiModal.style.display = 'flex';
        logLine(`${actionType.toUpperCase()} check completed successfully!`, 'success');
      } else {
        logLine(`Error: ${data.error}`, 'error');
      }
    } catch (err) {
      logLine(`Network error: ${err.message}`, 'error');
    }
  }

  document.getElementById('compile-btn').addEventListener('click', () => runAction('compile'));
  document.getElementById('decompile-btn').addEventListener('click', () => runAction('decompile'));
</script>
</body>
</html>
