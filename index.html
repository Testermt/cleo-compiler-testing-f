<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>GTA SA Online CLEO Compiler</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { background: #0c0f14; overflow-x: hidden; color: #e5e7eb; }
  #editor-container { height: 50vh; min-height: 320px; }
  .btn-press:active { transform: translateY(1px); }
</style>
</head>
<body class="bg-ink text-gray-200 font-mono min-h-screen flex flex-col">

  <header class="border-b border-gray-800 bg-[#12161d] p-3">
    <h1 class="text-sm font-bold text-amber-400">GTA SA CLEO Compiler (GUI Session)</h1>
  </header>

  <!-- GUI SCREENSHOT MODAL -->
  <div id="gui-screenshot-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-3" style="display: none;">
    <div class="bg-[#12161d] border border-gray-700 rounded p-4 max-w-3xl w-full flex flex-col gap-3">
      <div class="flex justify-between items-center border-b border-gray-700 pb-2">
        <h2 class="text-amber-400 text-sm font-bold">Sanny Builder GUI Live Screen</h2>
        <button id="gui-modal-close" class="text-gray-400 hover:text-white text-lg">&times;</button>
      </div>
      <div class="bg-[#181d26] p-2 flex justify-center rounded">
        <img id="gui-screenshot-img" src="" alt="GUI Output" class="max-w-full max-h-[70vh] object-contain rounded" />
      </div>
    </div>
  </div>

  <main class="flex-1 max-w-6xl w-full mx-auto p-3 flex flex-col gap-3">
    <div class="flex gap-2">
      <button id="start-session-btn" class="py-2 px-3 bg-teal-600 text-black font-bold rounded text-xs btn-press">  Start Session</button>
      <button id="compile-gui-btn" class="py-2.5 px-4 bg-amber-500 text-black font-bold rounded text-xs flex-1 btn-press">  GUI Check &amp; Compile</button>
    </div>

    <div id="editor-container" class="rounded border border-gray-800"></div>

    <div id="console-log" class="h-32 bg-[#12161d] border border-gray-800 rounded p-2 text-xs overflow-y-auto text-gray-400">
      <div>&gt; Ready. Click 'Start Session' first...</div>
    </div>
  </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs/loader.min.js"></script>
<script>
  const API_BASE = 'https://cleo-compiler-testing.onrender.com';
  let editor;

  require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs' } });
  require(['vs/editor/editor.main'], function () {
    editor = monaco.editor.create(document.getElementById('editor-container'), {
      value: `{$CLEO .cs}\n\n0000: NOP\n03A4: name_thread 'MAIN'\n\n:MAIN_START\nwait 0\nif\n  0256:   player $PLAYER_CHAR defined\njf @MAIN_START\n\n0001: wait 0\n0417: create_pickup_marker_at 0.0 0.0 0.0 color 1\n\n:MAIN_LOOP\nwait 250\njump @MAIN_LOOP\n`,
      language: 'cpp',
      theme: 'vs-dark',
      automaticLayout: true,
      fontSize: 13
    });
  });

  const consoleLog = document.getElementById('console-log');
  function logLine(text, type = 'info') {
    const line = document.createElement('div');
    line.className = type === 'error' ? 'text-red-400' : (type === 'success' ? 'text-green-400' : 'text-gray-300');
    line.innerHTML = `[${new Date().toLocaleTimeString()}] ${text}`;
    consoleLog.appendChild(line);
    consoleLog.scrollTop = consoleLog.scrollHeight;
  }

  document.getElementById('start-session-btn').addEventListener('click', async () => {
    logLine('Starting persistent Sanny Builder session...', 'info');
    try {
      const res = await fetch(`${API_BASE}/api/gui/session/start`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ game: 'sa' })
      });
      const data = await res.json();
      if (data.success) {
        logLine('Session started successfully!', 'success');
      } else {
        logLine(`Error: ${data.error}`, 'error');
      }
    } catch (err) {
      logLine(`Network error: ${err.message}`, 'error');
    }
  });

  const guiModal = document.getElementById('gui-screenshot-modal');
  const guiScreenshotImg = document.getElementById('gui-screenshot-img');
  document.getElementById('gui-modal-close').addEventListener('click', () => guiModal.style.display = 'none');

  document.getElementById('compile-gui-btn').addEventListener('click', async () => {
    if (!editor) return;
    const code = editor.getValue();
    logLine('Updating script & triggering F6 compile...', 'info');
    try {
      const actionRes = await fetch(`${API_BASE}/api/gui/session/action`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, keys: 'F6' })
      });
      const actionData = await actionRes.json();
      if (!actionData.success) {
        logLine(`Action Error: ${actionData.error}`, 'error');
        return;
      }

      await new Promise(r => setTimeout(r, 1200));

      const ssRes = await fetch(`${API_BASE}/api/gui/session/screenshot`);
      const ssData = await ssRes.json();

      if (ssData.success && ssData.gui_screenshot) {
        guiScreenshotImg.src = ssData.gui_screenshot;
        guiModal.style.display = 'flex';
        logLine('Live GUI screenshot captured successfully!', 'success');
      } else {
        logLine(`Screenshot Error: ${ssData.error}`, 'error');
      }
    } catch (err) {
      logLine(`Network error: ${err.message}`, 'error');
    }
  });
</script>
</body>
</html>
